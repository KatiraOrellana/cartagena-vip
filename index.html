<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0f3a3c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cartagena">
<title>Cartagena con amigas</title>
<style>
:root{--bg:#0f3a3c;--card:#14484a;--ink:#f4efe4;--muted:#a9cbc3;--coral:#ff8f80;--line:rgba(255,255,255,.18)}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:radial-gradient(circle at 70% 15%,#1d6a66 0,transparent 45%),var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,'Segoe UI',Arial,sans-serif;display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.card{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:28px 24px;display:grid;gap:14px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.sun{width:64px;height:64px;border-radius:18px;background:url(icon-192.png) center/cover}
h1{margin:0;font-size:26px;line-height:1.1;letter-spacing:-.8px}
h1 em{font-style:normal;color:var(--coral)}
p{margin:0;color:var(--muted);font-size:13px}
label.f{display:grid;gap:6px;font-size:12px;font-weight:700;color:var(--muted)}
input[type=password]{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.2);color:var(--ink);font-size:16px}
input[type=password]:focus{outline:3px solid #f0c46b;outline-offset:1px}
.rem{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
button{padding:13px;border-radius:12px;border:0;background:var(--coral);color:#fff;font-weight:800;font-size:15px;cursor:pointer}
button:disabled{opacity:.6}
.err{color:#ffb4a8;font-size:13px;min-height:1.2em}
</style>
</head>
<body>
<form class="card" id="gate" autocomplete="off">
<div class="sun" aria-hidden="true"></div>
<h1>Cartagena <em>con amigas</em></h1>
<p>13 — 17 nov 2026 · Solo para el grupo. Escribe la contraseña que te compartieron.</p>
<label class="f" for="pw">Contraseña<input type="password" id="pw" required autofocus></label>
<label class="rem"><input type="checkbox" id="rem" checked> Recordar en este teléfono</label>
<button id="go">Entrar</button>
<div class="err" id="err" role="alert"></div>
</form>
<script>
(async function(){
const te=new TextEncoder(),td=new TextDecoder();
const b64=a=>btoa(String.fromCharCode(...new Uint8Array(a))),ub64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const meta=await fetch('meta.json',{cache:'no-cache'}).then(r=>r.json());
async function derive(pw){const base=await crypto.subtle.importKey('raw',te.encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:ub64(meta.salt),iterations:meta.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},true,['decrypt'])}
async function dec(key,buf){const u=new Uint8Array(buf);return crypto.subtle.decrypt({name:'AES-GCM',iv:u.slice(0,12)},key,u.slice(12))}
async function open(key){
  await dec(key,ub64(meta.check));
  const [app,...fotos]=await Promise.all(['app',...meta.fotos].map(n=>fetch('d-'+n+'.bin').then(r=>{if(!r.ok)throw new Error('net');return r.arrayBuffer()}).then(b=>dec(key,b))));
  window.__F={};meta.fotos.forEach((n,i)=>{window.__F[n]=URL.createObjectURL(new Blob([fotos[i]],{type:'image/jpeg'}))});
  let html=td.decode(app).split('__F_portada__').join(window.__F.portada);
  document.open();document.write(html);document.close();
}
const err=document.getElementById('err'),btn=document.getElementById('go');
try{const saved=localStorage.getItem('ctg-key');if(saved){btn.disabled=true;btn.textContent='Abriendo…';const k=await crypto.subtle.importKey('raw',ub64(saved),'AES-GCM',true,['decrypt']);await open(k);return}}catch(e){try{localStorage.removeItem('ctg-key')}catch(_){}btn.disabled=false;btn.textContent='Entrar'}
document.getElementById('gate').addEventListener('submit',async e=>{
  e.preventDefault();err.textContent='';btn.disabled=true;btn.textContent='Abriendo…';
  try{const k=await derive(document.getElementById('pw').value.trim());
    try{await dec(k,ub64(meta.check))}catch(_){throw new Error('pw')}
    if(document.getElementById('rem').checked){try{localStorage.setItem('ctg-key',b64(await crypto.subtle.exportKey('raw',k)))}catch(_){}}
    await open(k);
  }catch(x){err.textContent=x.message==='pw'?'Contraseña incorrecta. Revisa mayúsculas y guiones.':'No se pudo abrir. Revisa tu conexión e intenta de nuevo.';btn.disabled=false;btn.textContent='Entrar'}
});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
</body>
</html>
